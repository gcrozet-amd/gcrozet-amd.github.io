    }
    setBusy(btn, true, kind === 'disable' ? 'Déchiffrement…' : 'Chiffrement…');
    try {
      if (kind === 'disable') {
        await saveChain;
        if (!lsSet(STORE_KEY, JSON.stringify(state))) throw new Error('storage');
        lsDel(SEC_KEY); lsSet(NOLOCK_KEY, '1');

        toast('Protection désactivée : données enregistrées en clair', 'warn', 4000);
      } else {
        await saveChain;
        await Vault.create(v('pw1'), state);

      }
      modalOnClose = null;
      closeModal();

/* ---------- Clics (délégation) ---------- */
let holdT = null, holdI = null, holdFired = false;
document.addEventListener('click', e => {
  if (!appReady) return;
  const term = e.target.closest('[data-term]');
  if (term) { e.preventDefault(); e.stopPropagation(); openPopover(term); return; }
  const pop = $('#popover');
  if (pop && !pop.hidden && !e.target.closest('#popover')) closePopover();
  if (e.target.classList.contains('modal-backdrop')) { closeModal(); return; }
  if (e.target.classList.contains('search-backdrop')) { closeSearch(); return; }
  const stepBtn = e.target.closest('[data-step]');
  if (stepBtn) { if (holdFired) { holdFired = false; return; } doStep(stepBtn); return; }
  const tabEl = e.target.closest('[data-tab]');
  if (tabEl) { e.preventDefault(); closeSearch(); closeModal(); showTab(tabEl.dataset.tab); return; }
  const a = e.target.closest('[data-action]');
  if (!a || a.disabled) return;
  const fn = ACTIONS[a.dataset.action];
  if (fn) { e.preventDefault(); fn(a, e); }
});

/* ---------- Boutons + / − (appui long = répétition) ---------- */
function clearHold() { clearTimeout(holdT); clearInterval(holdI); holdT = holdI = null; }
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-step]');
  if (!b || e.button > 0) return;
  holdFired = false;
  clearHold();
  holdT = setTimeout(() => { holdFired = true; doStep(b); holdI = setInterval(() => doStep(b), 90); }, 450);
});
['pointerup', 'pointercancel', 'dragstart'].forEach(ev => document.addEventListener(ev, clearHold));
window.addEventListener('scroll', () => {
  clearHold();
  const pop = $('#popover');
  if (pop && !pop.hidden && Math.abs(window.scrollY - (pop._y || 0)) > 60) closePopover();
}, { passive: true });
window.addEventListener('blur', clearHold);
window.addEventListener('resize', closePopover);
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-step]')) e.preventDefault(); });

function doStep(b) {
  const wrap = b.closest('[data-stepper]');
  const input = wrap && wrap.querySelector('input');
  if (!input) return;
  const dir = +b.dataset.step;
  const step = parseFloat(input.dataset.stepsize) || 1;
  const min = input.dataset.min != null ? +input.dataset.min : -Infinity;
  const max = input.dataset.max != null ? +input.dataset.max : Infinity;
  let v = parseNum(input.value);
  if (v == null || Number.isNaN(v) || (v === 0 && dir > 0 && input.dataset.zstart === '1' && input.dataset.start != null)) {
    v = input.dataset.start != null ? +input.dataset.start : (Number.isFinite(min) ? Math.max(0, min) : 0);
  } else {
    const k = v / step;
    const base = dir > 0 ? Math.floor(k + 1e-9) : Math.ceil(k - 1e-9);
    v = (base + dir) * step;
  }
  v = clamp(clean(v, 3), min, max);
  input.value = fmtInput(v);
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

/* ---------- Liaison champs ↔ état ---------- */
function applyBinding(t, commit) {
  const path = t.dataset.bind;
  const type = t.dataset.type || 'num';
  const required = t.dataset.required === '1';
  let v;
  if (type === 'num' || type === 'int') {
    v = parseNum(t.value);
    if (Number.isNaN(v)) { if (commit) t.value = fmtInput(getPath(path)); return; }
    if (v == null) {
      if (required) { if (commit) t.value = fmtInput(getPath(path)); return; }
      v = 0;
    }
    if (type === 'int') v = Math.round(v);
    if (commit) {
      if (t.dataset.min != null) v = Math.max(+t.dataset.min, v);
      if (t.dataset.max != null) v = Math.min(+t.dataset.max, v);
    }
  } else if (type === 'select-num') {
    v = parseFloat(t.value);
  } else if (type === 'time') {
    v = t.value;
    if (!v && required) { if (commit) t.value = getPath(path) || ''; return; }
  } else v = t.value;
  setPath(path, v);
  if (commit && (type === 'num' || type === 'int')) t.value = fmtInput(v);
  afterChange(path);
}
function afterChange(path) {
  if (path.startsWith('draft.')) { update1RMPreview(); return; }
  if (path.startsWith('sd.')) { updateStartPreview(); return; }
  save();
  if (path.startsWith('nutrition.')) { if (ui.tab === 'nutrition') updateNutrition(); }
  else if (path.startsWith('suivi.')) scheduleSuiviUpdate();
}
document.addEventListener('input', e => { if (appReady && e.target.matches('[data-bind]')) applyBinding(e.target, false); });
document.addEventListener('change', e => {
  if (!appReady) return;
  if (e.target.matches('[data-bind]')) applyBinding(e.target, true);
  if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ''; }
});

/* ---------- Clavier ---------- */
const isTyping = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
document.addEventListener('keydown', e => {
  if (!appReady) return;
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    if ($('#search-root').innerHTML) closeSearch(); else openSearch();
    return;
  }
  if (e.key === 'Escape') {
    if (!$('#popover').hidden) { closePopover(); return; }
    if ($('#search-root').innerHTML) { closeSearch(); return; }
    if ($('#modal-root').innerHTML) { closeModal(); return; }
  }
  if (e.key === '/' && !isTyping(e.target) && !$('#search-root').innerHTML && !$('#modal-root').innerHTML) { e.preventDefault(); openSearch(); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('input[data-bind]')) e.target.blur();
});
window.addEventListener('hashchange', () => {
  if (!appReady) return;
  const h = location.hash.slice(1);
  if (VIEWS[h] && h !== ui.tab) showTab(h);
});

   ===================================================================== */
let initDone = false;
function init() {
  appReady = true;
  ui.week = defaultWeek();
  ui.session = defaultSession();
  document.body.classList.remove('locked');
  refreshChrome();
  if (!initDone) {
    initDone = true;
    refreshIcons();
    const mac = /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent || '');
    $$('[data-kbd]').forEach(k => { k.textContent = mac ? '⌘ K' : 'Ctrl K'; });
    // Passage de minuit / de semaine pendant que l'app reste ouverte
    let lastDay = isoDate();
    setInterval(() => { if (isoDate() !== lastDay) { lastDay = isoDate(); refreshChrome(); if (ui.tab === 'today') rerender(); } }, 60 * 1000);
    setInterval(checkAutoLock, 10 * 1000);
  }
  const h = location.hash.slice(1);
  showTab(VIEWS[h] ? h : 'today');
  saveNow();
}
